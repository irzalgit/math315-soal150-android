name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Sync web assets
        run: npx cap sync android

      - name: Restore debug keystore
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "panjang secret: ${#KS}"
          if [ -z "$KS" ]; then
            echo "Secret DEBUG_KEYSTORE_BASE64 kosong atau tidak terbaca"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore
          ls -l ~/.android/debug.keystore

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: math315-soal150-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
